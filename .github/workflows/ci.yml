name: FresherFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Node dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python worker syntax
        run: python -m py_compile worker/ingest.py
